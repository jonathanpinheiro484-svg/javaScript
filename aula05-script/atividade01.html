<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    
<script>
let valor = prompt(`Digita o numero`)
  while (valor <= 10){
        document.write(`
        <br> Valor: </b> ${valor}
        <hr>
    `);
    valor ++;
      }



</script>
