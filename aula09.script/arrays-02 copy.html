<html lang="en">

<body>

<script>
    const produtos = ["ARROZ", "FEIJÃO", "LEITE", "CAFÉ"];

    let pesquisar = prompt("Digite um produto").toUpperCase();
    let encontrar = produtos.includes(pesquisar);

    if (encontrar != true) {
        document.write(`Produto: <b> ${pesquisar} </b> nao encontrado`);
    } else {
        document.write(`Produto: <b> ${pesquisar} </b> encontrado`);
    }

    // alert(produtos);

</script>
