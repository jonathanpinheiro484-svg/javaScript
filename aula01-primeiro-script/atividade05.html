<body>


    <h3 class="d-block p-2 text-bg-primary"> Atividade 04</h3>

    <script>

        curso = prompt('Insira o seu curso')
        Professor = prompt('Insira o seu Professor')

        document.write(`<div class="h4 pb-2 mb-4 text-danger border-bottom border-danger">Olá,Informaçoes de cadastro</div>`);
        document.write(`<div class="border border-success p-2 mb-2">${nome}</div>`)
        document.write(`<div class="border border-success p-2 mb-2">${curso}}</div>`)
        document.write(`<div class="border border-success p-2 mb-2">${Professor}</div>`)




    </script>
