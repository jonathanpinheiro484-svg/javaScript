<script>
 
// return devolve um valor de dentro da função para quem chamou a função.
 
// A função recebe um número.
function dobrar(numero) {
 
 // return = “devolve esse resultado para mim.”
  return numero * 2;
}
 
// Chamamos a função com o número 5.
// O return devolve o valor 10.
const resultado = dobrar(5);
 
// A variável resultado guarda o valor 10.
console.log(resultado);
 
// Resultado: 10
 
</script>
