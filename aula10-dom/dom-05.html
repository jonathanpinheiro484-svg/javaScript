<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>

    <div id="conteudo"></div>

    <script>
        const divConteudo = document.getElementById('#conteudo');

        //textContent envia texto para o elemento capturado.
        divConteudo.textContent = 'Conteúdo enviado pelo JavaScript';
    </script>



</script>
</body>
</html>
