<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>

    <div id="resultado"></div>

    <script>
        const resultado = document.getElementById('resultado');

        //textContent trata tudo como texto.
        resultado.innerHTML = '<strong>Olá, turma!</strong>';
    </script>



</script>
</body>
</html>
