<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

  <h3 class="d-block p-2 text-bg-primary"> Atividade 04</h3>

  <script>


    let nome = prompt('Digita seu nome:', '');
    let cor = prompt('Digita a cor desejada:', '');
    document.write(`
        <div class="shadow p-3 mb-5 bg-body-tertiary rounded">
<h4>Cor de fundo da página:</h4>
Olá, ${nome}, você definiu como: <b><span class="text-uppercase"> ${cor}</span></b> a cor de fundo da página.
</div>
`);

    document.body.style.backgroundColor = cor
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
