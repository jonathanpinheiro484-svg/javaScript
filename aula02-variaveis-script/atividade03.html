<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <head>

    <body>



        <h3 class="d-block p-2 text-bg-primary"> Atividade 03</h3>

        <script>


            produto = prompt('Insira o produto');
            preço = prompt('Insiara o preço');
            quantidade = prompt('Insiara sua quantidade');
            valor = null

            valor = (preço * quantidade)


            document.write(`<table class="table table-dark">
  <tbody>
    <tr>
      <td>produto</td>
      <td>preço</td>
      <td>quantidade</td>
      <td>valor</td>
    </tr>
    <tr>
      <td>${produto}</td>
      <td>${preço}</td>
      <td>${quantidade}</td>
      <td>${valor}</td>
    </tr>
  </tbody>
</table>`);

            console.log(`
                produto: ${produto}\n
                preço: ${preço}\n
                quantidade: ${quantidade}
                total: ${valor}`)


        </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    </body>

</html>
